<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Default map</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

    </head>

    <body id="doc">
        <div id="sdk-map" allow="geolocation"></div>
        <script type="module" src="./index.js"></script>
    </body>

    <style>
        #sdk-map {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        p {
            position: absolute;
            z-index: 1;
        }

        body button {
            background-color: #ffcc66;
            position: absolute;
            z-index: 1;
            width: 5em;
            height: 5em;
            border-radius: 50%;
            border-color: #000000;
            border: 0.3em;
            align-items: center;
            justify-content: center;
            display: flex;
            cursor: pointer;
            outline: none;
        }

        #boton_agregar_id {
            top: 85%;
            left: 1em;
        }

        button svg {
            color: #000000;
            background-color: none;
            width: 70%;
            height: 70%;
        }
    </style>
